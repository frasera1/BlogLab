services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: bloglab-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${BLOGDB_SA_PASSWORD:-BlogLab!DevSa2026}
    ports:
      - "14333:1433"
    volumes:
      - bloglab-sqldata:/var/opt/mssql

  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: bloglab-db-init
    depends_on:
      db:
        condition: service_started
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${BLOGDB_SA_PASSWORD:-BlogLab!DevSa2026}
      BLOGDB_APP_USER: ${BLOGDB_APP_USER:-bloguser}
      BLOGDB_APP_PASSWORD: ${BLOGDB_APP_PASSWORD:-change-me}
    volumes:
      - ./docker/db/init:/usr/config/init:ro
    entrypoint:
      - /bin/bash
      - /usr/config/init/init-db.sh
    restart: "no"

  api:
    build:
      context: .
      dockerfile: BlogLab.Web/Dockerfile.dev
    container_name: bloglab-api
    working_dir: /workspace
    env_file:
      - path: .env
        required: false
      - path: .env.local
        required: false
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://0.0.0.0:5000
      DOTNET_USE_POLLING_FILE_WATCHER: "1"
      Jwt__Issuer: http://localhost:5000
      CLOUDINARY_URL: ${CLOUDINARY_URL:-}
      CloudinaryOptions__CloudName: ${CLOUDINARY_CLOUD_NAME:-}
      CloudinaryOptions__ApiKey: ${CLOUDINARY_API_KEY:-}
      CloudinaryOptions__ApiSecret: ${CLOUDINARY_API_SECRET:-}
      ConnectionStrings__DefaultConnection: "Server=db,1433;Database=BlogDB;User Id=${BLOGDB_APP_USER:-bloguser};Password=${BLOGDB_APP_PASSWORD:-change-me};Persist Security Info=False;Pooling=False;MultipleActiveResultSets=False;Encrypt=False;TrustServerCertificate=True"
    depends_on:
      db-init:
        condition: service_completed_successfully
    volumes:
      - .:/workspace
      - bloglab-nuget:/root/.nuget/packages
    ports:
      - "5000:5000"
    command: >
      sh -c "dotnet restore BlogLab.sln --disable-build-servers --artifacts-path /tmp/dotnet-artifacts &&
      dotnet run --project BlogLab.Web --no-launch-profile --disable-build-servers --artifacts-path /tmp/dotnet-artifacts --urls http://0.0.0.0:5000"

  ui:
    build:
      context: ./BlogLab-UI
      dockerfile: Dockerfile.dev
    container_name: bloglab-ui
    working_dir: /usr/src/app
    environment:
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    volumes:
      - ./BlogLab-UI:/usr/src/app
      - bloglab-ui-node-modules:/usr/src/app/node_modules
    ports:
      - "4200:4200"
    command: >
      sh -c "if [ ! -d node_modules ] || [ -z \"$(ls -A node_modules 2>/dev/null)\" ]; then npm ci; fi &&
      npm start -- --host 0.0.0.0 --port 4200 --poll 2000"

  ui-next:
    build:
      context: ./bloglab-ui-next
      dockerfile: Dockerfile.dev
    container_name: bloglab-ui-next
    working_dir: /usr/src/app
    env_file:
      - path: ./bloglab-ui-next/.env.local
        required: false
    environment:
      NEXT_PUBLIC_BLOGLAB_API_BASE_URL: http://localhost:5000/api
      BLOGLAB_SERVER_API_BASE_URL: http://api:5000/api
      BLOGLAB_OLLAMA_ENABLED: "true"
      BLOGLAB_OLLAMA_HOST_URL: http://host.docker.internal:11434
      BLOGLAB_OLLAMA_MODEL: llama3.2:latest
      BLOGLAB_OLLAMA_TIMEOUT_MS: "45000"
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    depends_on:
      api:
        condition: service_started
    volumes:
      - ./bloglab-ui-next:/usr/src/app
      - bloglab-ui-next-node-modules:/usr/src/app/node_modules
    ports:
      - "${BLOGLAB_UI_NEXT_HOST_PORT:-3001}:3000"
    command: >
      sh -c "npm run dev -- --hostname 0.0.0.0 --port 3000"

volumes:
  bloglab-sqldata:
  bloglab-nuget:
  bloglab-ui-node-modules:
  bloglab-ui-next-node-modules:
